<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alimenta | Registro</title>
    <link rel="stylesheet" href="/styles.css?v=20260802" />
  </head>
  <body
    class="auth-bg min-h-screen grid lg:grid-cols-[1.05fr_.95fr] p-4 md:p-7"
  >
    <section
      class="hidden lg:flex dot-grid rounded-[2rem] text-white p-12 flex-col justify-between"
    >
      <div class="flex items-center gap-3 font-bold text-xl">🍽 alimenta</div>
      <div class="max-w-xl">
        <span class="glass px-4 py-2 rounded-full text-sm"
          >Comunidad institucional</span
        >
        <h1 class="display text-5xl leading-tight font-extrabold mt-7">
          Tu comedor, más cerca de ti.
        </h1>
        <p class="text-blue-100 text-lg mt-5">
          Crea tu cuenta y recibe siempre el menú actualizado.
        </p>
      </div>
    </section>
    <main
      class="bg-white rounded-[2rem] flex items-center justify-center p-6 md:p-12"
    >
      <section class="w-full max-w-md">
        <a href="/" class="text-brand-600 text-sm font-bold"
          >← Volver a ingresar</a
        >
        <p class="text-brand-600 font-semibold text-sm mb-2 mt-7">
          NUEVA CUENTA
        </p>
        <h1 class="display text-3xl font-bold text-slate-900">
          Únete al comedor
        </h1>
        <p class="text-slate-500 mt-2 text-sm">
          Completa tus datos institucionales.
        </p>
        <form id="register-form" class="mt-7 space-y-4">
          <label class="block text-sm font-semibold"
            >Nombre completo<input
              name="name"
              required
              placeholder="Escribe tu nombre completo"
              class="mt-2 w-full border border-slate-200 rounded-xl px-4 py-3.5" /></label
          ><label class="block text-sm font-semibold"
            >Correo electrónico<input
              name="email"
              type="email"
              required
              placeholder="nombre@institucion.edu"
              class="mt-2 w-full border border-slate-200 rounded-xl px-4 py-3.5"
          /></label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <label class="block text-sm font-semibold"
              >Grado<select
                id="grade"
                name="grado"
                required
                class="mt-2 w-full border border-slate-200 bg-white rounded-xl px-4 py-3.5"
              >
                <option value="">Selecciona</option>
              </select></label
            ><label class="block text-sm font-semibold"
              >Grupo<select
                id="group"
                name="grupo"
                required
                class="mt-2 w-full border border-slate-200 bg-white rounded-xl px-4 py-3.5"
              >
                <option value="">Selecciona</option>
              </select></label
            >
          </div>
          <label class="block text-sm font-semibold"
            >Contraseña<input
              name="password"
              type="password"
              minlength="6"
              required
              placeholder="Mínimo 6 caracteres"
              class="mt-2 w-full border border-slate-200 rounded-xl px-4 py-3.5" /></label
          ><button
            class="w-full rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5"
          >
            Crear mi cuenta
          </button>
        </form>
      </section>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
